<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" fill="none" role="img" aria-label="Emircan Bakar — Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080b"/>
      <stop offset="100%" stop-color="#0b0c11"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b8fa8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8b8fa8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mapFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mapMask">
      <rect x="560" y="0" width="440" height="220" fill="url(#mapFade)"/>
    </mask>

    <clipPath id="clip"><rect width="1000" height="220" rx="14"/></clipPath>

    <style>
      text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .in { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: .10s } .d2 { animation-delay: .28s } .d3 { animation-delay: .46s }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .grow { transform-origin: 58px 0; animation: grow 1.1s .5s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:.7 } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <ellipse cx="760" cy="110" rx="380" ry="200" fill="url(#halo)"/>

    <!-- subtle map-like contour lines, nodding to the mapping work -->
    <g mask="url(#mapMask)" fill="none" stroke="#9aa3bd" stroke-opacity="0.20" stroke-width="1">
      <path d="M600 24c60 34 90 12 150 40s72 74 140 66 96-40 140-28"/>
      <path d="M584 66c66 30 96 8 156 36s76 70 144 62 92-36 136-24"/>
      <path d="M572 108c70 26 102 4 162 32s80 66 148 58 88-32 132-20"/>
      <path d="M588 150c68 28 98 6 158 34s78 68 146 60 90-34 134-22"/>
      <path d="M604 192c62 30 92 8 152 36"/>
    </g>
    <g mask="url(#mapMask)" fill="#c9d1e6">
      <circle class="pulse" cx="742" cy="86" r="2.2"/>
      <circle class="pulse" cx="864" cy="140" r="2" style="animation-delay:1.3s"/>
      <circle class="pulse" cx="668" cy="150" r="1.8" style="animation-delay:2.4s"/>
    </g>

    <text class="in d1" x="58" y="92" font-size="46" font-weight="600" letter-spacing="-1" fill="#f2f4f8">Emircan Bakar</text>

    <g class="in d2">
      <text x="60" y="124" font-size="13" letter-spacing="4" fill="#8a91a6">FRONTEND DEVELOPER</text>
    </g>

    <rect class="grow" x="58" y="144" width="300" height="1" fill="url(#rule)"/>

    <text class="in d3" x="60" y="176" font-size="13.5" letter-spacing="0.4" fill="#6f7789">React · Next.js · TypeScript · MapLibre GL · Three.js</text>

    <rect x="0.5" y="0.5" width="999" height="219" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  </g>
</svg>

name: Profile metrics

on:
  schedule:
    - cron: "0 3 * * *" # Her gün 06:00 (İstanbul)
  workflow_dispatch:     # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Genel istatistikler: commit, PR, issue, repo sayıları
      - name: General stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: emircanbakar
          template: classic
          base: header, activity, repositories
          config_timezone: Europe/Istanbul

      # Dil dağılımı (private repolar dahil)
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: emircanbakar
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_skipped: new-mind-ai
          config_timezone: Europe/Istanbul

      # Yıllık katkı takvimi
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: emircanbakar
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Istanbul
